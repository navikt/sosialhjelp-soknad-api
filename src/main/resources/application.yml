server:
  servlet:
    context-path: '/sosialhjelp/soknad-api'
  shutdown: graceful
  max-http-request-header-size: 16KB

spring:
  servlet:
    multipart:
      max-file-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDPORTEN_ISSUER:http://localhost:8888/default}

digisos:
  cache:
    kodeverk:
      time-to-live: 86400

token_exchange_endpoint: ${NAIS_TOKEN_EXCHANGE_ENDPOINT}
token_endpoint: ${NAIS_TOKEN_ENDPOINT}
token_introspection_endpoint: ${NAIS_TOKEN_INTROSPECTION_ENDPOINT}

springdoc:
  api-docs:
    enabled: true

idporten:
  audience: ${IDPORTEN_CLIENT_ID}